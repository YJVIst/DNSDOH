# Standalone example. Replace certificate paths and hostnames before use.
# nginx -t -c /mnt/youlin-data/DNSDOH/deploy/nginx.conf
pid /mnt/youlin-data/runtime/nginx.pid;
error_log /mnt/youlin-data/runtime/nginx-main.log warn;
worker_processes auto;
events { worker_connections 2048; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_body_temp_path /mnt/youlin-data/runtime/nginx-body;
    proxy_temp_path /mnt/youlin-data/runtime/nginx-proxy;
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    # Request paths contain bearer credentials. Do not record URLs, referers or headers.
    access_log off;
    # Request-time errors can include the URI; suppress these on credential endpoints.
    server {
        listen 443 ssl;
        http2 on;
        server_name dnsdoh-admin.example.com;
        ssl_certificate /mnt/youlin-data/runtime/tls/fullchain.pem;
        ssl_certificate_key /mnt/youlin-data/runtime/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        error_log /dev/null crit;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location /downloads/ {
        alias /mnt/youlin-data/hosting/downloads/;
        autoindex off;
        default_type application/octet-stream;
        add_header Cache-Control "no-store";
    }
    location / {
            proxy_pass http://127.0.0.1:18080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 15s;
        }
    }
    server {
        listen 443 ssl;
        http2 on;
        server_name doh.example.com;
        ssl_certificate /mnt/youlin-data/runtime/tls/fullchain.pem;
        ssl_certificate_key /mnt/youlin-data/runtime/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        error_log /dev/null crit;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location /dns-query/ {
            proxy_pass http://127.0.0.1:18080/dns-query/;
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            proxy_read_timeout 10s;
        }
        location = /healthz { proxy_pass http://127.0.0.1:18080; }
        location = /readyz { proxy_pass http://127.0.0.1:18080; }
        location / { return 404; }
    }
    # For an independent node, copy the doh server block and change its hostname,
    # certificate and proxy_pass to that machine's loopback node listener (:18081).
    # Bind the Rust process to loopback. Open public TCP/443 only, not UDP/TCP/53.
}
